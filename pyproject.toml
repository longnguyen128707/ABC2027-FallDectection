[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "abc2027"
version = "0.1.0"
description = "ABC2027 UWB Challenge: Fall detection in continuous radar streams"
requires-python = ">=3.10"
license = {text = "CC BY-NC 4.0"}
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "h5py==3.16.0",
    "pytest==9.1.1",
    "scikit-learn==1.7.2",
    "nbconvert==7.17.1",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "ipykernel==6.30.1",
    "jupyter-client==8.6.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
